name: Nightly fork sync

# One sync a day, at night. A fork sync is a production deploy on that
# instance (Vercel rebuilds the frontend, the Supabase pairing applies
# migrations and redeploys edge functions), and every deploy invalidates the
# chunks a signed-in operator already has loaded. On the evening of 2026-09-04
# six hand-run syncs landed between 21:28 and 01:38 CET while an operator was
# working in the project view on optic — that is the incident this schedule
# closes. An instance that cannot wait is synced by hand, alone:
# `./scripts/sync-forks.sh <fork>` — that path does not go through this
# workflow and is unaffected by the once-a-day guard below.
#
# Secrets (upstream repo only): FORK_TOKEN_<FORK> (Contents: read/write on
# that fork) and variables FORK_REPO_<FORK> (owner/repo) for each of
# WWW OPTIC LITEIT AUTOVERSIO RESTA LABS1100 MJP. GitHub reserves the GITHUB_
# prefix for its own names, so these differ from the .env.local names the
# script also understands. A fork without both is skipped and listed — never
# silently.

on:
  schedule:
    # 20:53 UTC — chosen from MEASURED lateness, not from when we want it.
    #
    # GitHub queues scheduled runs behind everyone else's. '30 2' fired at
    # 07:21 and 07:27 UTC; moving to '23 1' changed nothing — it fired 06:01,
    # 06:04 and 05:52 on three consecutive nights. That is a steady ~4.5 h
    # debt, not jitter, and 05:52 UTC is 07:52 CEST: the moment people start.
    #
    # So aim 4.5 h early. 20:53 plus the usual debt lands around 01:30 UTC,
    # the middle of the night in CET/CEST. Off the :00/:30 marks for the same
    # reason as before — round times are the busiest queue.
    #
    # If the debt ever shrinks the run simply happens earlier in the evening,
    # still outside working hours. The guard below is what makes a mistimed
    # run harmless.
    - cron: '53 20 * * *'
  workflow_dispatch:
    inputs:
      fork:
        description: 'Sync one fork only (e.g. LITEIT); empty = all'
        required: false
        default: ''
      force:
        description: 'Run even if a sync already succeeded today (UTC)'
        type: boolean
        required: false
        default: false
      unproven:
        description: 'Sync WITHOUT the fresh-install proof (an emergency fix that cannot wait 15 minutes)'
        type: boolean
        required: false
        default: false

# ── Prove, then deploy ────────────────────────────────────────────────────────
# A sync is a production deploy on six sites. Until 2026-11-11 it ran on its
# own clock, and the fresh install that proves main ran hours LATER (its 02:37
# cron lands around 10 UTC): on the night of 11-10 a change that let an invoice
# dated in a closed month be issued reached every fork at 01:30 and was found
# red at 10:17. Now the order is the point: gate → proof → sync. The proof is
# the fresh-install workflow itself, called here; the sync hands out main only
# when main is still the commit that was proved (plus the bot's own stamp).

jobs:
  # ── One sync per UTC day, whoever asks ──────────────────────────────────────
  # A late schedule and a hand dispatch are not two requests; they are the
  # same night's sync arriving twice. On 2026-09-11 both ran — a dispatch
  # at 02:12 and the delayed schedule at 06:04 — a second production deploy
  # across six customer sites at 08:04 CEST, exactly what the schedule
  # exists to prevent. The clock is what is unreliable; this makes the
  # unreliability harmless. Asked FIRST, so a second arrival does not spend a
  # fifteen-minute proof either.
  #
  # Counts SUCCESSFUL runs of this workflow created today (UTC), excluding
  # this one. `force: true` is the deliberate override.
  gate:
    name: already synced today?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fleet-only: forks inherit this file but must never sync each other.
    if: github.repository == 'magnusfroste/flowwink'
    # The guard reads this workflow's own run history; that needs
    # actions:read, which a repo on restricted default permissions would not
    # hand out. Named here so the guard cannot fail closed by surprise.
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.once.outputs.skip }}
    steps:
      - name: Already synced today?
        id: once
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCED:-false}" = "true" ]; then
            echo "::notice::force=true — running even though today may already be synced."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          earlier="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-fork-sync.yml/runs?status=success&created=${today}&per_page=100" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length")"
          if [ "${earlier:-0}" -gt 0 ]; then
            echo "::notice::A sync already succeeded today (${earlier} run(s)) — skipping. Re-run with force:true to override."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── The proof: main, installed from zero, every process run ─────────────────
  proof:
    name: prove main from zero
    needs: gate
    if: needs.gate.outputs.skip != 'true' && inputs.unproven != true
    uses: ./.github/workflows/fresh-install-nightly.yml
    permissions:
      contents: write   # the green stamp is committed to main
      packages: read
    secrets: inherit
    with:
      stamp: true

  sync:
    name: merge-upstream on every fork
    needs: [gate, proof]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs after a GREEN proof — or, deliberately, without one (unproven: true).
    # A red or cancelled proof syncs nothing: the fleet keeps yesterday's main.
    if: >-
      always() && github.repository == 'magnusfroste/flowwink'
      && needs.gate.outputs.skip != 'true'
      && (needs.proof.result == 'success' || (needs.proof.result == 'skipped' && inputs.unproven == true))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # merge-upstream hands a fork whatever main is NOW, not the commit that
      # was proved. A merge that landed during the proof would ride along
      # unproven — so main must still be the proved commit, give or take the
      # bot's own stamp. Anything else stops the sync, red: run it again and
      # the new main is proved first.
      - name: Is main still what was proved?
        if: needs.proof.result == 'success'
        env:
          PROVEN: ${{ needs.proof.outputs.proven_sha }}
        run: |
          set -euo pipefail
          if [ -z "${PROVEN}" ]; then
            echo "::error::the proof did not say which commit it proved — not syncing."; exit 1
          fi
          since="$(git diff --name-only "${PROVEN}" HEAD | grep -vxF 'scripts/process-battery/last-green.json' || true)"
          if [ -n "${since}" ]; then
            echo "::error::main moved during the proof (proved ${PROVEN}, now $(git rev-parse HEAD)). Not syncing an unproved main — run this workflow again."
            echo "${since}" | head -40
            exit 1
          fi
          echo "main is the proved commit ${PROVEN} (plus the stamp, if any)."

      - name: Unproved sync, on request
        if: needs.proof.result == 'skipped'
        run: echo "::warning::unproven=true — syncing main WITHOUT the fresh-install proof, as asked."

      - name: Sync
        env:
          FORK_TOKEN_WWW: ${{ secrets.FORK_TOKEN_WWW }}
          FORK_TOKEN_OPTIC: ${{ secrets.FORK_TOKEN_OPTIC }}
          FORK_TOKEN_LITEIT: ${{ secrets.FORK_TOKEN_LITEIT }}
          FORK_TOKEN_AUTOVERSIO: ${{ secrets.FORK_TOKEN_AUTOVERSIO }}
          FORK_TOKEN_RESTA: ${{ secrets.FORK_TOKEN_RESTA }}
          FORK_TOKEN_LABS1100: ${{ secrets.FORK_TOKEN_LABS1100 }}
          FORK_TOKEN_MJP: ${{ secrets.FORK_TOKEN_MJP }}
          FORK_REPO_WWW: ${{ vars.FORK_REPO_WWW }}
          FORK_REPO_OPTIC: ${{ vars.FORK_REPO_OPTIC }}
          FORK_REPO_LITEIT: ${{ vars.FORK_REPO_LITEIT }}
          FORK_REPO_AUTOVERSIO: ${{ vars.FORK_REPO_AUTOVERSIO }}
          FORK_REPO_RESTA: ${{ vars.FORK_REPO_RESTA }}
          FORK_REPO_LABS1100: ${{ vars.FORK_REPO_LABS1100 }}
          FORK_REPO_MJP: ${{ vars.FORK_REPO_MJP }}
        run: |
          # No secrets configured at all → say so and exit green; the schedule
          # must never red-fail main for a missing setup step.
          if [ -z "$FORK_TOKEN_WWW$FORK_TOKEN_OPTIC$FORK_TOKEN_LITEIT$FORK_TOKEN_AUTOVERSIO$FORK_TOKEN_RESTA$FORK_TOKEN_LABS1100$FORK_TOKEN_MJP" ]; then
            echo "::warning::No FORK_TOKEN_<FORK> secrets configured — nothing to sync. Add them to enable the nightly sync."
            exit 0
          fi
          ./scripts/sync-forks.sh ${{ inputs.fork }}
