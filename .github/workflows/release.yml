name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Fleet-only: forks inherit this file but not its purpose — a fork that
    # wants it sets the repository variable FLEET_WORKFLOWS=true.
    if: github.repository == 'magnusfroste/flowwink' || vars.FLEET_WORKFLOWS == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # The product name is READ from package.json, never spelled out here.
      # v3.0.0 published under the pre-rebrand name because this workflow
      # carried it hardcoded. It survived the rebrand unnoticed: every earlier
      # release was cut by hand, so this string had never once run.
      # See src/lib/__tests__/brand.guardrails.test.ts.
      - name: Get product name
        id: product
        run: echo "NAME=$(node -p "require('./package.json').displayName")" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ steps.version.outputs.VERSION }}"
          
          # Get content between this version header and the next version header
          CHANGELOG=$(awk "/## \[${VERSION}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)
          
          # If no specific section found, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          
          # Escape for GitHub Actions output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "NOTES<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Determine pre-release
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.product.outputs.NAME }} v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.NOTES }}
            
            ---
            
            ## Upgrade Instructions
            
            ```bash
            # Using the upgrade script (recommended)
            ./scripts/upgrade.sh
            
            # Or manually
            git pull origin main
            npm install
            supabase db push
            supabase functions deploy --all
            npm run build
            ```
            
            See [UPGRADING.md](https://github.com/${{ github.repository }}/blob/main/docs/UPGRADING.md) for detailed instructions.
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
