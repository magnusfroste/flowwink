name: Docker image (self-hosted frontend)

# WHY THIS EXISTS
# ---------------
# Self-hosted deployments (Easypanel on a VPS, internal servers behind a
# firewall) should PULL a prebuilt image instead of building on the box —
# the Vite build needs ~4 GB RAM and OOM-dies on small VPSes. This workflow
# builds the frontend image on GitHub's runners on RELEASE TAGS (and on
# demand) and publishes it to GitHub Container Registry. Easypanel then
# deploys it in "Docker Image" mode: ghcr.io/<owner>/flowwink-frontend:stable
#
# It used to build on every push to main as well (:dev) — ~5 builds a day
# that no deployment pulled. Self-hosted instances pin a release; the image
# follows the release. Run it by hand (workflow_dispatch) for a one-off.
#
# NOTE: VITE_* values are baked into the bundle at BUILD time, but the
# container entrypoint (docker/40-runtime-env.sh) overrides them from env vars
# at start, so one image serves any Supabase instance. Set VITE_SUPABASE_* as
# repository variables only if you want them baked. They are NOT secrets — the
# publishable/anon key ships in the public JS bundle by design.
#
# See docs/operators/self-hosted-frontend.md for the full runbook.

on:
  push:
    # Release tags build and get VERSIONED image tags (:vX.Y.Z + :stable) so
    # self-hosted deployments pin a release.
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  # Per-ref so a release-tag build is never cancelled by a concurrent main push.
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    # Fleet-only: forks inherit this file but not its purpose — a fork that
    # wants it sets the repository variable FLEET_WORKFLOWS=true.
    if: github.repository == 'magnusfroste/flowwink' || vars.FLEET_WORKFLOWS == 'true'
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/flowwink-frontend
      # Non-sensitive (see note above) but deliberately WITHOUT an instance
      # default: this used to bake the upstream dev instance's URL and anon key
      # into every image, so a self-hosted container that forgot its env vars
      # quietly ran against somebody else's database. Now the bake-in is a
      # placeholder and the container entrypoint (docker/40-runtime-env.sh)
      # MUST supply VITE_SUPABASE_* at start — an unconfigured image fails
      # visibly instead of pointing at the wrong backend.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'set-VITE_SUPABASE_PUBLISHABLE_KEY-at-container-start' }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'example' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Release: pinnable version tag + a moving :stable pointer.
            V="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:${V},${IMAGE}:stable" >> "$GITHUB_OUTPUT"
          else
            # main: bleeding edge, as before.
            echo "tags=${IMAGE}:dev,${IMAGE}:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 covers most VPSes; arm64 covers ARM VPSes (Hetzner CAX,
          # Oracle Ampere) and local testing on Apple Silicon.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PROJECT_ID=${{ env.VITE_SUPABASE_PROJECT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
