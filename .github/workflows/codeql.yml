# CodeQL — GitHub's static analysis, free on a public repository. Taint
# queries for the web app (XSS, open redirect, prototype pollution, unsafe
# deserialisation, request forgery where the source is modelled). It is one
# more reader, not the method: Deno's `serve((req) => req.json())` is not a
# modelled source, so the SSRF of 2026-11-07 is caught by the repo's own
# guard (outbound-urls-are-public), not here. Results land under Security →
# Code scanning. Fleet-only: forks carry their own.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'   # Tuesdays 04:17 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    if: github.repository == 'magnusfroste/flowwink' || vars.FLEET_WORKFLOWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
